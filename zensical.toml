[project]
site_name = "NextITS"
site_author = "Vladimir Mikryukov"
site_description = "A Nextflow pipeline for metabarcoding fungi and other eukaryotes with full-length ITS (PacBio) and short-read (Illumina) data."
copyright = "Copyright © 2026 Vladimir Mikryukov. All rights reserved."

site_url = "https://Next-ITS.github.io/"
repo_url = "https://github.com/vmikk/NextITS"
repo_name = "vmikk/NextITS"

extra_css = ["stylesheets/extra.css"]

# CorelDRAW source files for figures (not published)
exclude_docs = """
*.cdr
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quick start" = "quickstart.md" },
  ] },
  { "User guide" = [
    { "Running the pipeline" = "usage.md" },
    { "Output files" = "output.md" },
    { "Running on HPC" = "HPC.md" },
  ] },
  { "Reference" = [
    { "Parameters" = "parameters.md" },
    { "Changelog" = "https://github.com/vmikk/NextITS/blob/main/CHANGELOG.md" },
  ] },
]

[project.theme]
variant = "modern"
favicon = "assets/NextITS_logo_square.png"
logo = "assets/NextITS_logo.webp"
font.text = "Ubuntu"
font.code = "Ubuntu Mono"
features = [
  "content.action.copy",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Palette: follow system preference, with manual light/dark toggle
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vmikk/NextITS"
name = "NextITS on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/vmikk/nextits"
name = "NextITS container on Docker Hub"


[project.plugins.glightbox]
auto_caption = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
